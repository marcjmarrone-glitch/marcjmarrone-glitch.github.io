<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <meta name="description" content="A collection of things I've built.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap hero">
    <p class="eyebrow">Hi, I'm</p>
    <h1 id="site-name">Your Name</h1>
    <p class="tagline" id="site-tagline">I build small, useful things. Here's what I've made so far.</p>
    <nav class="links" id="site-links"></nav>
  </header>

  <main class="wrap">
    <div class="section-head">
      <h2>Projects</h2>
      <div class="filters" id="filters" role="toolbar" aria-label="Filter by tag"></div>
    </div>
    <div class="grid" id="projects"></div>
    <p class="empty" id="empty" hidden>No projects yet. Add one in <code>projects.js</code>.</p>
  </main>

  <footer class="wrap footer">
    <span id="year"></span> · Built with plain HTML, hosted on GitHub Pages
  </footer>

  <script src="projects.js"></script>
  <script src="main.js"></script>
</body>
</html>
